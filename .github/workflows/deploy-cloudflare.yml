name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "**/*.test.ts"
      - "**/*.test.mjs"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Typecheck, Build & Deploy Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Next.js typecheck
        run: npm run typecheck

      - name: Run core unit tests
        run: npx --yes tsx --test lib/html-extract.test.ts lib/rate-limit.test.ts lib/checkout-helpers.test.ts lib/logger.test.ts lib/rbac.test.ts lib/media-security.test.ts lib/image-url.test.ts lib/backup-verify.test.ts

      - name: Build OpenNext Cloudflare Worker bundle
        run: npm run build

      - name: Apply D1 performance indexes & Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ℹ️ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID chưa cấu hình trong GitHub Secrets — việc deploy được thực hiện qua Cloudflare Workers Builds tích hợp sẵn."
            exit 0
          fi
          npx wrangler d1 execute thucduong-shop-db --remote --file=migrations/0002_performance_indexes.sql --yes
          npx opennextjs-cloudflare deploy

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "### Cloudflare Workers Build & Verify Thành Công"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **Website:** https://thucduongshop.duyvo.win"
          } >> "$GITHUB_STEP_SUMMARY"
