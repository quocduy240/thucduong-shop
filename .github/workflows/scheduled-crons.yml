name: Scheduled Cron Jobs (CRM, YouTube Sync, Compliance)

on:
  schedule:
    # Daily at 08:00 ICT (01:00 UTC): YouTube channel sync
    - cron: "0 1 * * *"
    # Daily at 09:00 ICT (02:00 UTC): Post-purchase CRM automation emails
    - cron: "0 2 * * *"
    # Weekly on Monday at 10:00 ICT (03:00 UTC): Medical/YMYL compliance auto-sync
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Cron target (all, crm, youtube, compliance)"
        required: true
        default: "all"

permissions:
  contents: read

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CRM Automation
        if: ${{ github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'crm') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not configured in GitHub repository settings; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://thucduongshop.duyvo.win/api/cron/crm-automation/" \
            -H "x-cron-secret: ${CRON_SECRET}"

      - name: Trigger YouTube Sync
        if: ${{ github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'youtube') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not configured in GitHub repository settings; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://thucduongshop.duyvo.win/api/cron/youtube-sync/" \
            -H "x-cron-secret: ${CRON_SECRET}"

      - name: Trigger Compliance Sync
        if: ${{ github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'compliance') }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not configured in GitHub repository settings; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://thucduongshop.duyvo.win/api/cron/compliance-sync/" \
            -H "x-cron-secret: ${CRON_SECRET}"
