name: Daily Cloudflare D1 Backup

on:
  schedule:
    # 20:00 UTC = 03:00 sáng giờ Việt Nam (UTC+7) mỗi ngày
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, Verify & Archive D1 Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Export Cloudflare D1 database
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ℹ️ Bỏ qua bước export D1 trên GitHub Actions vì chưa cấu hình CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID trong GitHub Secrets."
            echo "has_backup=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p backups
          STAMP=$(date -u +"%Y%m%d-%H%M%S")
          RAW_FILE="backups/thucduong-d1-${STAMP}.sql"
          GZ_FILE="${RAW_FILE}.gz"
          npx wrangler d1 export thucduong-shop-db --remote --output="$RAW_FILE"
          node scripts/verify-d1-backup.mjs "$RAW_FILE"
          gzip -9 -k "$RAW_FILE"
          sha256sum "$GZ_FILE" > "${GZ_FILE}.sha256"
          rm -f "$RAW_FILE"
          echo "has_backup=1" >> "$GITHUB_OUTPUT"
          echo "gz_file=$GZ_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=${GZ_FILE}.sha256" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Upload compressed backup to GitHub Artifacts (30 days)
        if: ${{ steps.export.outputs.has_backup == '1' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thucduong-d1-backup-${{ steps.export.outputs.stamp }}
          path: |
            ${{ steps.export.outputs.gz_file }}
            ${{ steps.export.outputs.sha_file }}
          retention-days: 30
          if-no-files-found: error

      - name: Optional — Mirror backup to Cloudflare R2 bucket
        if: ${{ steps.export.outputs.has_backup == '1' && vars.R2_BACKUP_BUCKET != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
        run: |
          GZ_FILE="${{ steps.export.outputs.gz_file }}"
          KEY="d1-backups/$(basename "$GZ_FILE")"
          npx wrangler r2 object put "${R2_BACKUP_BUCKET}/${KEY}" --file="$GZ_FILE" --content-type="application/gzip" --remote
          echo "✅ Đã lưu bản sao dự phòng lên R2: ${R2_BACKUP_BUCKET}/${KEY}"

      - name: Backup Summary
        if: success()
        run: |
          {
            echo "### Sao lưu Cloudflare D1 tự động"
            echo "- **Trạng thái:** \`${{ steps.export.outputs.has_backup == '1' && 'Đã xuất và lưu trữ 30 ngày' || 'Chờ cấu hình CLOUDFLARE_API_TOKEN trong GitHub Secrets' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
